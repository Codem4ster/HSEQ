<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Randomized Quiz</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #4a90e2;
            --success-color: #2ec4b6;
            --error-color: #e71d36;
            --text-color: #2b2d42;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .quiz-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h2 {
            margin-top: 0;
            font-size: 1.4rem;
            line-height: 1.4;
        }

        .progress {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            background-color: #f0f2f5;
            border: 2px solid #e4e6eb;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            box-sizing: border-box;
            color: var(--text-color);
        }

        @media (hover: hover) {
            .btn:hover:not(:disabled) {
                background-color: #e4e6eb;
                border-color: #ccd0d5;
            }
        }

        .btn:disabled {
            cursor: not-allowed;
        }

        .btn.correct {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .btn.wrong {
            background-color: var(--error-color);
            color: white;
            border-color: var(--error-color);
        }

        .feedback {
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            text-align: center;
            min-height: 24px;
        }

        .feedback.correct-text { color: var(--success-color); }
        .feedback.wrong-text { color: var(--error-color); }

        .action-btn {
            display: block;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 20px;
            cursor: pointer;
            text-align: center;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        .hidden {
            display: none !important;
        }

        .score-screen {
            text-align: center;
        }

        .score-text {
            font-size: 2rem;
            margin: 20px 0;
            color: var(--primary-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div id="quiz-screen">
        <div class="progress" id="progress">Loading database...</div>
        <h2 id="question-text">Parsing questions...</h2>
        <div class="options-container" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <button id="next-btn" class="action-btn hidden">Next Question</button>
    </div>

    <div id="score-screen" class="hidden score-screen">
        <h2>Quiz Completed!</h2>
        <div class="score-text" id="final-score">0 / 0</div>
        <p id="score-commentary"></p>
        <button id="restart-btn" class="action-btn">Restart Quiz</button>
    </div>
</div>

<script>
    let allQuestions = [];
    let shuffledQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;

    // Elements
    const quizScreen = document.getElementById('quiz-screen');
    const scoreScreen = document.getElementById('score-screen');
    const progressEl = document.getElementById('progress');
    const questionEl = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options');
    const feedbackEl = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');
    const finalScoreEl = document.getElementById('final-score');
    const restartBtn = document.getElementById('restart-btn');

    // 1. Line-by-Line File Parser (Fixes the 33-question cap)
    async function loadQuizData() {
        try {
            const response = await fetch('hseqa.txt');
            if (!response.ok) throw new Error('Could not find hseqa.txt');
            const text = await response.text();
            
            // Split the file contents by lines to handle large datasets properly
            const lines = text.split(/\r?\n/);
            allQuestions = [];

            lines.forEach((line) => {
                const trimmedLine = line.trim();
                // Ensure the line contains a valid bracket format (...)
                if (trimmedLine.startsWith('(') && trimmedLine.endsWith(')')) {
                    // Strip the outer brackets
                    const innerContent = trimmedLine.slice(1, -1);
                    const parts = innerContent.split('/');
                    
                    if (parts.length >= 5) {
                        const question = parts[0].trim();
                        const options = [];
                        let correctIndex = -1;

                        for (let i = 1; i <= 4; i++) {
                            let optionText = parts[i].trim();
                            if (optionText.endsWith('*')) {
                                optionText = optionText.slice(0, -1); // Strip the asterisk
                                correctIndex = i - 1;
                            }
                            options.push(optionText);
                        }

                        // Only add the question if it parsed correctly and found a right answer
                        if (correctIndex !== -1) {
                            allQuestions.push({ question, options, correctIndex });
                        }
                    }
                }
            });

            if (allQuestions.length === 0) {
                questionEl.textContent = "Error: Database loaded, but 0 valid questions were parsed. Check file formatting.";
                return;
            }

            startQuiz();

        } catch (error) {
            questionEl.textContent = "Error loading quiz text file. Make sure 'hseqa.txt' is in the same folder and you are running a local server.";
            console.error(error);
        }
    }

    // 2. Setup/Shuffle Logic
    function startQuiz() {
        // Deep copy and Fisher-Yates or simple random sorting
        shuffledQuestions = [...allQuestions].sort(() => Math.random() - 0.5);
        currentQuestionIndex = 0;
        score = 0;
        
        scoreScreen.classList.add('hidden');
        quizScreen.classList.remove('hidden');
        
        showQuestion();
    }

    // 3. Render Question
    function showQuestion() {
        resetState();
        const currentQuestion = shuffledQuestions[currentQuestionIndex];
        
        progressEl.textContent = `Question ${currentQuestionIndex + 1} of ${shuffledQuestions.length}`;
        questionEl.textContent = currentQuestion.question;

        currentQuestion.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.innerText = option;
            button.classList.add('btn');
            button.addEventListener('click', () => selectOption(button, index, currentQuestion.correctIndex));
            optionsContainer.appendChild(button);
        });
    }

    // 4. Inter-question State Reset
    function resetState() {
        nextBtn.classList.add('hidden');
        feedbackEl.textContent = '';
        feedbackEl.className = 'feedback';
        optionsContainer.innerHTML = '';
    }

    // 5. Answer Assessment
    function selectOption(selectedButton, selectedIndex, correctIndex) {
        const buttons = optionsContainer.querySelectorAll('.btn');
        buttons.forEach(btn => btn.disabled = true);

        if (selectedIndex === correctIndex) {
            selectedButton.classList.add('correct');
            feedbackEl.textContent = "✨ Correct!";
            feedbackEl.classList.add('correct-text');
            score++;
        } else {
            selectedButton.classList.add('wrong');
            buttons[correctIndex].classList.add('correct');
            feedbackEl.textContent = "❌ Incorrect.";
            feedbackEl.classList.add('wrong-text');
        }

        nextBtn.classList.remove('hidden');
    }

    // 6. Next Button Navigation
    nextBtn.addEventListener('click', () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < shuffledQuestions.length) {
            showQuestion();
        } else {
            showScore();
        }
    });

    // 7. Performance Score Display
    function showScore() {
        quizScreen.classList.add('hidden');
        scoreScreen.classList.remove('hidden');
        finalScoreEl.textContent = `${score} / ${shuffledQuestions.length}`;
        
        const percentage = (score / shuffledQuestions.length) * 100;
        let commentary = "Keep practicing!";
        if (percentage === 100) commentary = "Perfect score! Outstanding! 🏆";
        else if (percentage >= 70) commentary = "Great job! 👍";
        
        document.getElementById('score-commentary').textContent = commentary;
    }

    restartBtn.addEventListener('click', startQuiz);
    window.addEventListener('DOMContentLoaded', loadQuizData);
</script>

</body>
</html>
