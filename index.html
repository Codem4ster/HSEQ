<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSE Training Assessment</title>
    <style>
        :root {
            --primary-blue: #2c3e50;
            --safety-yellow: #f1c40f;
            --success-green: #27ae60;
            --danger-red: #c0392b;
            --bg-gray: #ecf0f1;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            background-color: var(--bg-gray);
            color: #333;
        }

        #quiz-container { 
            background: white; 
            padding: 0; 
            border-radius: 8px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); 
            width: 95%; 
            max-width: 600px; 
            overflow: hidden;
        }

        .header-bar {
            background-color: var(--primary-blue);
            color: var(--safety-yellow);
            padding: 1.5rem;
            text-align: center;
            border-bottom: 5px solid var(--safety-yellow);
        }

        .header-bar h1 {
            margin: 0;
            font-size: 1.4rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .quiz-content {
            padding: 2rem;
        }

        #question-text {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            line-height: 1.4;
            color: var(--primary-blue);
        }

        .options-container { 
            display: flex;
            flex-direction: column;
            gap: 12px; 
            margin: 20px 0; 
        }

        button { 
            padding: 15px; 
            border: 2px solid #ddd; 
            border-radius: 4px; 
            cursor: pointer; 
            background: #fff; 
            transition: all 0.2s ease; 
            font-size: 1rem; 
            text-align: left;
            font-weight: 500;
        }

        button:hover:not(:disabled) { 
            background: #f8f9fa;
            border-color: var(--primary-blue);
        }

        button:disabled { cursor: default; }

        .correct { 
            background-color: var(--success-green) !important; 
            border-color: #1e8449 !important; 
            color: white;
        }

        .incorrect { 
            background-color: var(--danger-red) !important; 
            border-color: #922b21 !important; 
            color: white;
        }

        #feedback { 
            margin-top: 15px; 
            font-weight: 600; 
            min-height: 1.5em;
            padding: 10px;
            border-radius: 4px;
        }

        .hidden { display: none; }

        #next-btn { 
            background-color: var(--primary-blue); 
            color: white; 
            border: none; 
            width: 100%; 
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 10px;
        }

        #next-btn:hover {
            background-color: #34495e;
        }

        #setup-msg {
            padding: 40px;
            text-align: center;
        }

        /* Mobile specific adjustments */
        @media (max-width: 480px) {
            .header-bar h1 { font-size: 1.1rem; }
            .quiz-content { padding: 1.2rem; }
            #question-text { font-size: 1.1rem; }
            button { padding: 12px; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <div class="header-bar">
        <h1>HSE Quiz</h1>
    </div>
    
    <div id="setup-msg">Initializing safety modules...</div>

    <div id="game-track" class="hidden quiz-content">
        <div id="question-text">Question loading...</div>
        <div class="options-container" id="options"></div>
        <div id="feedback"></div>
        <button id="next-btn" class="hidden">Continue to Next Module</button>
    </div>
</div>

<script>
    let allQuestions = [];
    let recentIndices = [];
    let currentQuestion = null;

    async function loadQuestions() {
        try {
            const response = await fetch('hseqa.txt');
            const text = await response.text();
            
            const regex = /\(([^)]+)\)/g;
            let match;
            
            while ((match = regex.exec(text)) !== null) {
                const parts = match[1].split('/');
                if (parts.length === 5) {
                    const questionObj = {
                        text: parts[0],
                        options: parts.slice(1).map(opt => ({
                            text: opt.replace('*', ''),
                            isCorrect: opt.includes('*')
                        }))
                    };
                    allQuestions.push(questionObj);
                }
            }
            
            if (allQuestions.length > 0) {
                document.getElementById('setup-msg').classList.add('hidden');
                document.getElementById('game-track').classList.remove('hidden');
                showNextQuestion();
            } else {
                document.getElementById('setup-msg').innerText = "System Error: No training data found.";
            }
        } catch (err) {
            document.getElementById('setup-msg').innerText = "Connection Error: Ensure the assessment server is active.";
        }
    }

    function showNextQuestion() {
        const feedback = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');
        const optionsDiv = document.getElementById('options');
        
        feedback.innerText = "";
        feedback.style.backgroundColor = "transparent";
        nextBtn.classList.add('hidden');
        optionsDiv.innerHTML = "";

        const threshold = Math.floor(allQuestions.length * 0.5);
        let availableIndices = allQuestions
            .map((_, i) => i)
            .filter(i => !recentIndices.includes(i));

        if (availableIndices.length === 0) {
            recentIndices = [];
            availableIndices = allQuestions.map((_, i) => i);
        }

        const randomIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
        currentQuestion = allQuestions[randomIndex];

        recentIndices.push(randomIndex);
        if (recentIndices.length > threshold) {
            recentIndices.shift();
        }

        document.getElementById('question-text').innerText = currentQuestion.text;

        const labels = ['A', 'B', 'C', 'D'];
        currentQuestion.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.innerHTML = `<span style="color: var(--primary-blue); font-weight: bold; margin-right: 10px;">${labels[index]}</span> ${opt.text}`;
            btn.onclick = () => handleAnswer(btn, opt.isCorrect);
            optionsDiv.appendChild(btn);
        });
    }

    function handleAnswer(selectedBtn, isCorrect) {
        const buttons = document.querySelectorAll('#options button');
        const feedback = document.getElementById('feedback');
        const nextBtn = document.getElementById('next-btn');

        buttons.forEach(btn => btn.disabled = true);

        if (isCorrect) {
            selectedBtn.classList.add('correct');
            feedback.innerText = "✓ COMPLIANT: Correct Answer.";
            feedback.style.color = "var(--success-green)";
        } else {
            selectedBtn.classList.add('incorrect');
            const correctOpt = currentQuestion.options.find(o => o.isCorrect);
            feedback.innerText = `⚠ NON-COMPLIANT: The correct procedure was: ${correctOpt.text}`;
            feedback.style.color = "var(--danger-red)";
            
            buttons.forEach((btn, idx) => {
                if (currentQuestion.options[idx].isCorrect) btn.classList.add('correct');
            });
        }
        nextBtn.classList.remove('hidden');
    }

    document.getElementById('next-btn').onclick = showNextQuestion;
    loadQuestions();
</script>

</body>
</html>
